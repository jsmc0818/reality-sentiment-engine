name: daily-scores
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = after US close, weekdays
  workflow_dispatch:

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: install dependencies
        run: python -m pip install -r requirements.txt
      - name: test public-data safety rules
        run: python -m unittest discover -s tests -v
      - name: refresh daily scores
        run: |
          for attempt in 1 2; do
            if python -m pipeline.run_daily; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              exit 1
            fi
            echo "::warning::daily refresh failed; retrying once in 30 seconds"
            sleep 30
          done
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: validate public market-data contract
        run: python -m pipeline.public_output data/scores.json data/timeline.json
      - name: commit scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "sentiment-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -- data/scores.json data/timeline.json data/episodes.json data/eps_history_*.csv data/eps_observations_*.csv data/cboe_equity_put_call.csv
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily scores $(date -u +%F)"
            git push
          fi

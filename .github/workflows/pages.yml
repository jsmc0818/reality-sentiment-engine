name: publish-website

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [daily-scores]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check public market data
        run: python -m pipeline.public_output data/scores.json data/timeline.json
      - name: Check website data bindings
        run: node app.js
      - name: Prepare public website files
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          cp -R assets _site/
          mkdir _site/data
          cp data/scores.json data/timeline.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

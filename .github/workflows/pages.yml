name: publish-website

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [daily-scores]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check public market data
        run: python -m pipeline.public_output data/scores.json data/timeline.json
      - name: Check website data bindings
        run: node app.js
      - name: Prepare public website files
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          cp -R assets _site/
          mkdir _site/data
          cp data/scores.json data/timeline.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
